# 工作流名称
name: Emall C++ Unit Tests

# 触发条件：推送到指定分支或发起 Pull Request
on:
  push:
    branches: [ version-0, main, master ]
  pull_request:
    branches: [ version-0, main, master ]

# 并发控制：同一分支的新提交会取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== 单元测试任务 ==========
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-22.04
    
    steps:
    # 1. 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 安装系统依赖
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++ \
          libsqlite3-dev \
          pkg-config \
          libssl-dev \
          uuid-dev \
          git \
          libjsoncpp-dev \
          zlib1g-dev \
          libbrotli-dev

    # 3. 缓存 Drogon 安装
    - name: Cache Drogon installation
      id: cache-drogon
      uses: actions/cache@v3
      with:
        path: |
          /usr/local/include/drogon
          /usr/local/lib/libdrogon*
          /usr/local/lib/cmake/Drogon
        key: drogon-v1.9.1-${{ runner.os }}

    # 4. 安装 Drogon 框架（如果缓存未命中）
    - name: Install Drogon framework
      if: steps.cache-drogon.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/drogonframework/drogon.git /tmp/drogon
        cd /tmp/drogon
        git checkout v1.9.1
        git submodule update --init --recursive
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    # 5. 编译项目
    - name: Build project
      working-directory: scripts
      env:
        CMAKE_PREFIX_PATH: /usr/local
        CI: true
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_PREFIX_PATH=/usr/local \
              ..
        make -j$(nproc)

    # 6. 编译单元测试
    - name: Build unit tests
      working-directory: scripts/test
      run: |
        mkdir -p build
        cd build
        cmake ..
        make -j$(nproc)

    # 7. 创建数据库目录
    - name: Prepare test environment
      run: |
        mkdir -p data/database

    # 8. 运行单元测试
    - name: Run unit tests
      working-directory: scripts/test/build
      run: |
        ./unit_test

    # 9. 上传测试报告（可选）
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          scripts/test/build/*.log
        if-no-files-found: ignore