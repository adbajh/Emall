# 工作流名称
name: Emall C++ Project CI

# 触发条件：推送到 version-0 分支或发起 Pull Request
on:
  push:
    branches: [ version-0, main, master ]
  pull_request:
    branches: [ version-0, main, master ]

# 并发控制：同一分支的新提交会取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== 任务 1: 编译和单元测试 ==========
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-22.04
    
    steps:
    # 1. 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. 安装系统依赖
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          g++-11 \
          libsqlite3-dev \
          pkg-config \
          libssl-dev \
          uuid-dev \
          git \
          libjsoncpp-dev \
          zlib1g-dev \
          libbrotli-dev

    # 3. 缓存 Drogon 安装
    - name: Cache Drogon installation
      id: cache-drogon
      uses: actions/cache@v3
      with:
        path: |
          /usr/local/include/drogon
          /usr/local/lib/libdrogon*
          /usr/local/lib/cmake/Drogon
        key: drogon-v1.9.1-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

    # 4. 安装 Drogon 框架
    - name: Install Drogon framework
      if: steps.cache-drogon.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/drogonframework/drogon.git /tmp/drogon
        cd /tmp/drogon
        git checkout v1.9.1
        git submodule update --init --recursive
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    # 5. 验证 Drogon 安装
    - name: Verify Drogon installation
      run: |
        echo "Checking Drogon installation..."
        ls -la /usr/local/lib/cmake/Drogon/ || echo "Drogon cmake files not found"
        ls -la /usr/local/include/drogon/ || echo "Drogon headers not found"
        pkg-config --modversion drogon || echo "pkg-config cannot find drogon"

    # 6. 编译项目
    - name: Build Emall project
      working-directory: scripts
      env:
        CMAKE_PREFIX_PATH: /usr/local
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_PREFIX_PATH=/usr/local \
              ..
        make -j$(nproc) VERBOSE=1

    # 7. 创建测试数据库目录
    - name: Initialize test database
      working-directory: scripts/build
      run: |
        mkdir -p ../../data/database

    # 8. 运行单元测试
    - name: Run unit tests
      working-directory: scripts/build
      run: |
        # 如果使用 CTest
        if [ -f "CTestTestfile.cmake" ]; then
          ctest --output-on-failure --verbose
        else
          # 直接运行测试可执行文件（如果存在）
          if [ -f "./unit_test" ]; then
            ./unit_test
          else
            echo "No test executable found, skipping tests"
          fi
        fi

    # 9. 上传测试报告
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          scripts/build/Testing/
          scripts/build/*.log
        if-no-files-found: ignore

  # ========== 任务 2: 代码质量检查 ==========
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-14 cmake

    - name: Install Drogon (for code quality check)
      run: |
        sudo apt-get install -y \
          libsqlite3-dev \
          libssl-dev \
          uuid-dev \
          libjsoncpp-dev \
          zlib1g-dev \
          libbrotli-dev
        
        git clone https://github.com/drogonframework/drogon.git /tmp/drogon
        cd /tmp/drogon
        git checkout v1.9.1
        git submodule update --init --recursive
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: Generate compile_commands.json
      working-directory: scripts
      run: |
        mkdir -p build && cd build
        cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_PREFIX_PATH=/usr/local \
              ..

    - name: Run clang-tidy
      working-directory: scripts/build
      run: |
        # 运行 clang-tidy（允许失败）
        find ../database ../controllers -name '*.cc' -or -name '*.cpp' | \
          xargs clang-tidy-14 -p . --checks='-*,readability-*,modernize-*' || true

  # ========== 任务 3: 模糊测试（可选）==========
  fuzz-test:
    name: Fuzz Testing (5 min)
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/version-0')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libsqlite3-dev \
          git

    - name: Install AFL++
      run: |
        git clone https://github.com/AFLplusplus/AFLplusplus /tmp/aflplusplus
        cd /tmp/aflplusplus
        make all -j$(nproc)
        sudo make install

    - name: Build fuzz target
      working-directory: scripts/test
      run: |
        mkdir -p build && cd build
        cmake ..
        make -j$(nproc)

    - name: Create seeds
      working-directory: scripts/test
      run: |
        mkdir -p seeds
        echo -ne '\x00admin\x00test\x00pass123' > seeds/seed1
        echo -ne '\x01user\x00password' > seeds/seed2

    - name: Run fuzzing (5 minutes)
      working-directory: scripts/test
      env:
        AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: 1
        AFL_SKIP_CPUFREQ: 1
      run: |
        timeout 300 afl-fuzz -i seeds -o afl_output -m none \
          -- ./build/emall_fuzz @@ || true

    - name: Check for crashes
      working-directory: scripts/test
      run: |
        if [ -d "afl_output/default/crashes" ]; then
          crash_count=$(ls -1 afl_output/default/crashes/id:* 2>/dev/null | wc -l)
          echo "Found $crash_count crashes"
          if [ $crash_count -gt 0 ]; then
            echo "::warning::Fuzzing found $crash_count crashes"
            ls -lh afl_output/default/crashes/
          fi
        else
          echo "No crashes directory found"
        fi

    - name: Upload fuzzing results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-results
        path: scripts/test/afl_output/
        if-no-files-found: ignore